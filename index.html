<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS - System Interface</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050b14;
      color: #00f0ff;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* HUD Canvas */
    #hud-container {
      position: relative;
      width: 400px;
      height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Status e Logs */
    #status {
      margin-top: 20px;
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 8px #00f0ff;
    }
    #transcript-log {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #88c0d0;
      max-width: 80%;
      text-align: center;
      min-height: 2em;
    }

    /* Player do YouTube Embutido */
    #music-player-container {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 320px;
      height: 180px;
      border: 1px solid #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      display: none;
    }
    #youtube-player {
      width: 100%;
      height: 100%;
    }
  </style>

  <!-- SDK Google Gen AI -->
  <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.run/@google/genai"
      }
    }
  </script>
</head>
<body>

  <div id="hud-container">
    <canvas id="hudCanvas" width="400" height="400"></canvas>
  </div>

  <div id="status">INICIALIZANDO...</div>
  <div id="transcript-log">Diga "Jarvis" ou "Hey Jarvis" para começar.</div>

  <!-- Player de Músicas Oculto/Flutuante -->
  <div id="music-player-container">
    <div id="youtube-player"></div>
  </div>

  <!-- Tag de Áudio Oculta para Web Audio API / ElevenLabs -->
  <audio id="elevenAudio" crossorigin="anonymous" style="display:none;"></audio>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script type="module">
    import { GoogleGenAI } from '@google/genai';

    // ==========================================
    // 1. CONFIGURAÇÕES E CHAVES DE API
    // ==========================================
    const GEMINI_API_KEY = 'AQ.Ab8RN6LDj1iHEY_tzfAmQqUzh4spvysZiSYcUXyNAkBHXgGfNw';
    const ELEVENLABS_API_KEY = 'sk_8160fd261a9a0b01ef9321fff20aeabbf6b5550c5c9ed266';
    const VOICE_ID = 'IKne3meq5aSn9XLyUdCD'; // Voice ID padrão (Adam)

    // ==========================================
    // 2. INICIALIZAÇÃO DO CÉREBRO (GEMINI)
    // ==========================================
    const ai = new GoogleGenAI({ apiKey: GEMINI_API_KEY });
    let chatSession = null;

    async function initGemini() {
      try {
        chatSession = ai.chats.create({
          model: 'gemini-2.5-flash',
          config: {
            systemInstruction: 'Você é o JARVIS, uma inteligência artificial sofisticada inspirada na IA de Tony Stark. Responda em português do Brasil de forma sucinta, direta e elegante, perfeita para síntese de voz. Não use emojis, asteriscos ou marcadores de formatação.'
          }
        });
      } catch (err) {
        console.error("Erro ao inicializar Gemini:", err);
      }
    }
    initGemini();

    // ==========================================
    // 3. ELEMENTOS DA INTERFACE E CANVAS HUD
    // ==========================================
    const canvas = document.getElementById('hudCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('transcript-log');
    const audioElement = document.getElementById('elevenAudio');

    let currentState = 'idle'; // Estados: 'idle', 'listening', 'thinking', 'speaking'
    let angle = 0;

    // ==========================================
    // 4. WEB AUDIO API (ANALISADOR DE FREQUÊNCIA)
    // ==========================================
    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let dataArray = null;

    function setupWebAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        
        sourceNode = audioCtx.createMediaElementSource(audioElement);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);

        analyser.fftSize = 256;
        const bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // ==========================================
    // 5. MOTOR DE ANIMAÇÃO DO CANVAS HUD
    // ==========================================
    function drawHUD() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      angle += 0.01;

      // Cor de base dependendo do estado
      let baseColor = { r: 0, g: 240, b: 255 }; // Azul (idle)
      if (currentState === 'listening') baseColor = { r: 0, g: 255, b: 102 }; // Verde
      if (currentState === 'thinking') baseColor = { r: 255, g: 0, b: 255 };  // Roxo

      // Reatividade ao áudio
      let volumeMultiplier = 0;
      if (currentState === 'speaking' && dataArray) {
        baseColor = { r: 255, g: 153, b: 0 }; // Laranja ao falar
        analyser.getByteFrequencyData(dataArray);

        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          sum += dataArray[i];
        }
        const averageVolume = sum / dataArray.length;
        volumeMultiplier = (averageVolume / 255) * 1.5;
      }

      const colorStr = (opacity) => `rgba(${baseColor.r}, ${baseColor.g}, ${baseColor.b}, ${opacity})`;

      // Anel Externo Giratório
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.strokeStyle = colorStr(0.5);
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 15]);
      ctx.beginPath();
      ctx.arc(0, 0, 140, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Anel Interno Pulsante e Reativo
      const staticPulse = Math.sin(Date.now() * 0.005) * 5;
      const reactivePulse = currentState === 'speaking' ? volumeMultiplier * 35 : 0;
      
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-angle * 1.5);
      ctx.strokeStyle = colorStr(0.8);
      ctx.lineWidth = 1.5 + (reactivePulse * 0.1);
      ctx.setLineDash([45, 15]);
      ctx.beginPath();
      ctx.arc(0, 0, 100 + staticPulse + reactivePulse, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Núcleo Central Reativo
      const reactiveCore = currentState === 'speaking' ? volumeMultiplier * 25 : 0;
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, 40 + staticPulse + reactiveCore, 0, Math.PI * 2);
      ctx.fillStyle = colorStr(1);
      ctx.shadowColor = colorStr(1);
      ctx.shadowBlur = 15 + (reactiveCore * 2);
      ctx.fill();
      ctx.restore();

      requestAnimationFrame(drawHUD);
    }
    drawHUD();

    // ==========================================
    // 6. PLAYER DO YOUTUBE (MÚSICAS)
    // ==========================================
    let ytPlayer = null;
    window.onYouTubeIframeAPIReady = function() {
      ytPlayer = new YT.Player('youtube-player', {
        height: '180',
        width: '320',
        playerVars: { 'autoplay': 1, 'controls': 1 }
      });
    };

    function tocarMusica(nomeMusica) {
      document.getElementById('music-player-container').style.display = 'block';
      if (ytPlayer && ytPlayer.loadPlaylist) {
        ytPlayer.loadPlaylist({
          listType: 'search',
          list: nomeMusica,
          index: 0,
          startSeconds: 0
        });
      }
    }

    function pararMusica() {
      if (ytPlayer && ytPlayer.stopVideo) {
        ytPlayer.stopVideo();
        document.getElementById('music-player-container').style.display = 'none';
      }
    }

    // ==========================================
    // 7. SÍNTESE DE VOZ HIPER-REALISTA (ELEVENLABS)
    // ==========================================
    async function falar(texto) {
      setupWebAudio();

      currentState = 'speaking';
      statusEl.innerText = "RESPONDENDO...";

      try {
        const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'xi-api-key': ELEVENLABS_API_KEY
          },
          body: JSON.stringify({
            text: texto,
            model_id: 'eleven_multilingual_v2',
            voice_settings: { stability: 0.5, similarity_boost: 0.75 }
          })
        });

        if (!response.ok) throw new Error(`Erro ElevenLabs: ${response.statusText}`);

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);
        audioElement.src = audioUrl;

        audioElement.onended = () => {
          currentState = 'idle';
          statusEl.innerText = "SISTEMA ONLINE - AGUARDANDO ATIVAÇÃO";
          URL.revokeObjectURL(audioUrl);
        };

        await audioElement.play();

      } catch (error) {
        console.error("Erro na ElevenLabs, executando fallback nativo:", error);
        falarNativo(texto);
      }
    }

    function falarNativo(texto) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'pt-BR';
      utterance.onend = () => {
        currentState = 'idle';
        statusEl.innerText = "SISTEMA ONLINE - AGUARDANDO ATIVAÇÃO";
      };
      window.speechSynthesis.speak(utterance);
    }

    // ==========================================
    // 8. ESCUTA CONTÍNUA E PROCESSAMENTO
    // ==========================================
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      statusEl.innerText = "SISTEMA INCOMPATÍVEL (USE O GOOGLE CHROME)";
    } else {
      const recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.lang = 'pt-BR';
      recognition.interimResults = false;

      recognition.onstart = () => {
        statusEl.innerText = "SISTEMA ONLINE - AGUARDANDO ATIVAÇÃO";
      };

      recognition.onresult = async (event) => {
        const lastIndex = event.results.length - 1;
        const transcript = event.results[lastIndex][0].transcript.trim().toLowerCase();

        logEl.innerText = `Ouvido: "${transcript}"`;

        const wakeWords = ["jarvis", "hey jarvis", "ei jarvis"];
        let triggeredWord = wakeWords.find(word => transcript.includes(word));

        if (triggeredWord) {
          currentState = 'listening';
          const command = transcript.split(triggeredWord)[1].trim();

          if (command.length > 0) {
            await processarComando(command);
          } else {
            falar("Sim, senhor? Como posso ajudar?");
          }
        }
      };

      recognition.onend = () => {
        try { recognition.start(); } catch(e) {}
      };

      recognition.start();
    }

    async function processarComando(comando) {
      currentState = 'thinking';
      statusEl.innerText = "PROCESSANDO...";

      // Interceptação de comandos de música locais
      if (comando.includes("toque") || comando.includes("tocar") || comando.includes("coloque a música")) {
        const musica = comando.replace(/toque|tocar|coloque a música|música/g, "").trim();
        tocarMusica(musica);
        falar(`Com certeza. Reproduzindo ${musica}.`);
        return;
      }

      if (comando.includes("parar música") || comando.includes("pare a música") || comando.includes("desligar música")) {
        pararMusica();
        falar("Música interrompida, senhor.");
        return;
      }

      // Consulta ao Gemini para todos os outros comandos
      try {
        const response = await chatSession.sendMessage({ message: comando });
        falar(response.text);
      } catch (error) {
        console.error("Erro na API do Gemini:", error);
        falar("Desculpe, senhor. Tive um problema ao conectar aos servidores.");
      }
    }
  </script>
</body>
</html>
