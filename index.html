<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS - System Interface</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050b14;
      color: #00f0ff;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #hud-container {
      position: relative;
      width: 400px;
      height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
    #status {
      margin-top: 20px;
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 8px #00f0ff;
    }
    #transcript-log {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #88c0d0;
      max-width: 80%;
      text-align: center;
      min-height: 2em;
    }
    #start-btn {
      margin-top: 15px;
      padding: 12px 24px;
      background: transparent;
      border: 2px solid #00f0ff;
      color: #00f0ff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
      transition: all 0.3s ease;
      letter-spacing: 2px;
    }
    #start-btn:hover {
      background: #00f0ff;
      color: #050b14;
      box-shadow: 0 0 20px #00f0ff;
    }
    #music-player-container {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 320px;
      height: 180px;
      border: 1px solid #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      display: none;
    }
    #youtube-player {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="hud-container">
    <canvas id="hudCanvas" width="400" height="400"></canvas>
  </div>
  <div id="status">CLIQUE ABAIXO PARA INICIALIZAR</div>
  <button id="start-btn">INICIAR JARVIS</button>
  <div id="transcript-log">Aguardando ativação do sistema.</div>

  <div id="music-player-container">
    <div id="youtube-player"></div>
  </div>

  <audio id="elevenAudio" crossorigin="anonymous" style="display:none;"></audio>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script type="module">
    // ==========================================
    // 1. CONFIGURAÇÕES
    // ==========================================
    const PROXY_URL = "https://jarvis-gemini-prox.p808409.workers.dev"; // ← sua URL do Worker
    const ELEVENLABS_API_KEY = ''; // coloque sua chave ou deixe vazio para usar voz nativa
    const VOICE_ID = 'IKne3meq5aSn9XLyUdCD';

    // ==========================================
    // 2. ELEMENTOS DA INTERFACE
    // ==========================================
    const canvas = document.getElementById('hudCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('transcript-log');
    const startBtn = document.getElementById('start-btn');
    const audioElement = document.getElementById('elevenAudio');

    let currentState = 'idle';
    let angle = 0;
    let recognition = null;
    let conversationHistory = [];

    // Controle do novo comportamento
    let isListeningCommand = false;
    let silenceTimer = null;
    let currentCommand = "";
    const SILENCE_DELAY = 2000; // 2 segundos

    // ==========================================
    // 3. WEB AUDIO API
    // ==========================================
    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let dataArray = null;

    function setupWebAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        sourceNode = audioCtx.createMediaElementSource(audioElement);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyser.fftSize = 256;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // ==========================================
    // 4. BIP DE ATIVAÇÃO
    // ==========================================
    function tocarBip() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.frequency.value = 880;
        oscillator.type = "sine";

        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);

        oscillator.start(ctx.currentTime);
        oscillator.stop(ctx.currentTime + 0.18);
      } catch (e) {
        console.warn("Erro ao tocar bip:", e);
      }
    }

    // ==========================================
    // 5. ANIMAÇÃO DO HUD
    // ==========================================
    function drawHUD() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      angle += 0.01;

      let baseColor = { r: 0, g: 240, b: 255 };
      if (currentState === 'listening') baseColor = { r: 0, g: 255, b: 102 };
      if (currentState === 'thinking') baseColor = { r: 255, g: 0, b: 255 };

      let volumeMultiplier = 0;
      if (currentState === 'speaking' && dataArray) {
        baseColor = { r: 255, g: 153, b: 0 };
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        volumeMultiplier = (sum / dataArray.length / 255) * 1.5;
      }

      const colorStr = (opacity) => `rgba(${baseColor.r}, ${baseColor.g}, ${baseColor.b}, ${opacity})`;

      // Anel externo
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.strokeStyle = colorStr(0.5);
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 15]);
      ctx.beginPath();
      ctx.arc(0, 0, 140, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Anel interno
      const staticPulse = Math.sin(Date.now() * 0.005) * 5;
      const reactivePulse = currentState === 'speaking' ? volumeMultiplier * 35 : 0;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-angle * 1.5);
      ctx.strokeStyle = colorStr(0.8);
      ctx.lineWidth = 1.5 + (reactivePulse * 0.1);
      ctx.setLineDash([45, 15]);
      ctx.beginPath();
      ctx.arc(0, 0, 100 + staticPulse + reactivePulse, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Núcleo
      const reactiveCore = currentState === 'speaking' ? volumeMultiplier * 25 : 0;
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, 40 + staticPulse + reactiveCore, 0, Math.PI * 2);
      ctx.fillStyle = colorStr(1);
      ctx.shadowColor = colorStr(1);
      ctx.shadowBlur = 15 + (reactiveCore * 2);
      ctx.fill();
      ctx.restore();

      requestAnimationFrame(drawHUD);
    }
    drawHUD();

    // ==========================================
    // 6. PLAYER DO YOUTUBE
    // ==========================================
    let ytPlayer = null;
    window.onYouTubeIframeAPIReady = function() {
      ytPlayer = new YT.Player('youtube-player', {
        height: '180',
        width: '320',
        playerVars: { 'autoplay': 1, 'controls': 1 }
      });
    };

    function tocarMusica(nomeMusica) {
      document.getElementById('music-player-container').style.display = 'block';
      if (ytPlayer && ytPlayer.loadPlaylist) {
        ytPlayer.loadPlaylist({
          listType: 'search',
          list: nomeMusica,
          index: 0,
          startSeconds: 0
        });
      }
    }

    function pararMusica() {
      if (ytPlayer && ytPlayer.stopVideo) {
        ytPlayer.stopVideo();
        document.getElementById('music-player-container').style.display = 'none';
      }
    }

    // ==========================================
    // 7. SÍNTESE DE VOZ
    // ==========================================
    async function falar(texto) {
      setupWebAudio();
      currentState = 'speaking';
      statusEl.innerText = "RESPONDENDO...";

      if (!ELEVENLABS_API_KEY) {
        falarNativo(texto);
        return;
      }

      try {
        const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'xi-api-key': ELEVENLABS_API_KEY
          },
          body: JSON.stringify({
            text: texto,
            model_id: 'eleven_multilingual_v2',
            voice_settings: { stability: 0.65, similarity_boost: 0.85 }
          })
        });

        if (!response.ok) throw new Error("Erro ElevenLabs");

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);
        audioElement.src = audioUrl;

        audioElement.onended = () => {
          currentState = 'idle';
          statusEl.innerText = "SISTEMA ONLINE - AGUARDANDO ATIVAÇÃO";
          logEl.innerText = 'Diga "Jarvis" para ativar.';
          URL.revokeObjectURL(audioUrl);
        };

        await audioElement.play();
      } catch (error) {
        console.error("Erro ElevenLabs:", error);
        falarNativo(texto);
      }
    }

    function falarNativo(texto) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'pt-BR';
      utterance.onend = () => {
        currentState = 'idle';
        statusEl.innerText = "SISTEMA ONLINE - AGUARDANDO ATIVAÇÃO";
        logEl.innerText = 'Diga "Jarvis" para ativar.';
      };
      window.speechSynthesis.speak(utterance);
    }

    // ==========================================
    // 8. RECONHECIMENTO DE VOZ (NOVO COMPORTAMENTO)
    // ==========================================
    function initSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        statusEl.innerText = "SISTEMA INCOMPATÍVEL (USE GOOGLE CHROME)";
        return false;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.lang = 'pt-BR';
      recognition.interimResults = true;

      recognition.onstart = () => {
        if (!isListeningCommand) {
          statusEl.innerText = "SISTEMA ONLINE - AGUARDANDO ATIVAÇÃO";
          logEl.innerText = 'Diga "Jarvis" para ativar.';
        }
      };

      recognition.onresult = (event) => {
        let interim = "";
        let finalTranscript = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript.trim().toLowerCase();
          if (event.results[i].isFinal) {
            finalTranscript += transcript + " ";
          } else {
            interim += transcript;
          }
        }

        // === STANDBY: esperando palavra de ativação ===
        if (!isListeningCommand) {
          const fullText = (finalTranscript + " " + interim).toLowerCase();
          const wakeWords = ["jarvis", "hey jarvis", "ei jarvis"];

          if (wakeWords.some(word => fullText.includes(word))) {
            isListeningCommand = true;
            currentCommand = "";
            currentState = 'listening';
            statusEl.innerText = "OUVINDO...";
            logEl.innerText = "Pode falar o comando...";

            tocarBip();

            clearTimeout(silenceTimer);
            silenceTimer = setTimeout(finalizarEscuta, SILENCE_DELAY);
          }
          return;
        }

        // === ESCUTANDO O COMANDO ===
        if (finalTranscript) {
          currentCommand += finalTranscript + " ";
          logEl.innerText = `Comando: "${currentCommand.trim()}"`;
        } else if (interim) {
          logEl.innerText = `Ouvindo: "${interim}"`;
        }

        // Reinicia o timer de silêncio
        clearTimeout(silenceTimer);
        silenceTimer = setTimeout(finalizarEscuta, SILENCE_DELAY);
      };

      recognition.onend = () => {
        try { recognition.start(); } catch (e) {}
      };

      recognition.onerror = (event) => {
        console.warn("Erro no reconhecimento:", event.error);
      };

      recognition.start();
      return true;
    }

    async function finalizarEscuta() {
      if (!isListeningCommand) return;

      isListeningCommand = false;
      clearTimeout(silenceTimer);

      const comando = currentCommand.trim();
      currentCommand = "";

      if (comando.length > 0) {
        await processarComando(comando);
      } else {
        currentState = 'idle';
        statusEl.innerText = "SISTEMA ONLINE - AGUARDANDO ATIVAÇÃO";
        logEl.innerText = 'Diga "Jarvis" para ativar.';
      }
    }

    // ==========================================
    // 9. PROCESSAMENTO DE COMANDOS
    // ==========================================
    async function processarComando(comando) {
      currentState = 'thinking';
      statusEl.innerText = "PROCESSANDO...";

      // Comandos locais de música
      if (comando.includes("toque") || comando.includes("tocar") || comando.includes("coloque a música")) {
        const musica = comando.replace(/toque|tocar|coloque a música|música/g, "").trim();
        tocarMusica(musica);
        falar(`Com certeza, senhor. Reproduzindo ${musica}.`);
        return;
      }
      if (comando.includes("parar música") || comando.includes("pare a música") || comando.includes("desligar música")) {
        pararMusica();
        falar("Música interrompida.");
        return;
      }

      // Chamada ao proxy (OpenRouter)
      try {
        const response = await fetch(PROXY_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: comando,
            history: conversationHistory,
            systemInstruction: "Você é o JARVIS, uma inteligência artificial sofisticada inspirada na IA de Tony Stark. Responda em português do Brasil de forma sucinta, direta e elegante, perfeita para síntese de voz. Não use emojis, asteriscos ou marcadores de formatação."
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || data.error || "Erro no proxy");
        }

        const text = data.text;

        conversationHistory.push({ role: "user", text: comando });
        conversationHistory.push({ role: "model", text: text });

        if (conversationHistory.length > 20) {
          conversationHistory = conversationHistory.slice(-20);
        }

        falar(text);
      } catch (error) {
        console.error("Erro no proxy:", error);
        falar("Desculpe, senhor. Houve uma falha de comunicação com os servidores.");
      }
    }

    // ==========================================
    // 10. BOTÃO DE INICIALIZAÇÃO
    // ==========================================
    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      statusEl.innerText = "INICIALIZANDO MÓDULOS...";
      setupWebAudio();

      const speechOk = initSpeech();
      if (speechOk) {
        falar("Sistema Jarvis online e operacional, senhor.");
      }
    });
  </script>
</body>
</html>
